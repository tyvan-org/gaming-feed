apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaming-feed
  namespace: tyvan-tools
  labels:
    app: gaming-feed
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: gaming-feed
  template:
    metadata:
      labels:
        app: gaming-feed
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: gaming-feed
          image: ghcr.io/OWNER/REPO:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gaming-feed-secrets
                  key: DATABASE_URL
            - name: ARTICLES_TABLE
              valueFrom:
                secretKeyRef:
                  name: gaming-feed-secrets
                  key: ARTICLES_TABLE
                  optional: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
