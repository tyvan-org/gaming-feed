apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaming-feed
  namespace: tyvan-tools
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: APP_HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gaming-feed
                port:
                  name: http
